        function submitOrder() {
            try {
                var btn = document.querySelector('.submit-btn');

                // ユーザー選択チェック
                var userSelect = document.getElementById('userSelect');
                if (!userSelect.value) {
                    showModalAsync('注文者を選択してください。', 'alert');
                    return;
                }

                var userId = userSelect.value;
                var userName = userSelect.options[userSelect.selectedIndex].text;
                var deliveryType = userSelect.options[userSelect.selectedIndex].dataset.deliveryType;
                var category = userSelect.options[userSelect.selectedIndex].dataset.category;

                // チーム(Category/DeliveryType)ごとの設定を取得
                var rule = null;
                for (var rIndex = 0; rIndex < RULES.length; rIndex++) {
                    if (RULES[rIndex].DeliveryType == deliveryType) {
                        rule = RULES[rIndex];
                        break;
                    }
                }

                // "MustOrderAllDays"列
                var mustOrderAllDays = true;
                if (rule && rule.MustOrderAllDays !== undefined) {
                    var valStr = String(rule.MustOrderAllDays).trim().toUpperCase();
                    if (valStr === 'FALSE' || valStr === '0') {
                        mustOrderAllDays = false;
                    }
                }

                // 注文データの収集
                var orders = [];
                var dayCards = document.querySelectorAll('.day-card');

                if (dayCards.length === 0) {
                    showModalAsync('カレンダーが表示されていません。', 'alert');
                    return;
                }

                var missingDates = []; // 0個の日
                var multipleOrderDates = []; // 2個以上の日

                dayCards.forEach(function (card) {
                    var date = card.dataset.date;
                    var displayDate = card.dataset.displayDate || date;
                    var inputs = card.querySelectorAll('input');
                    var dayTotal = 0;

                    inputs.forEach(function (input) {
                        var val = input.value;
                        var qty = parseInt(val);
                        if (!isNaN(qty) && qty > 0) {
                            orders.push({
                                date: date,
                                productId: input.dataset.productId,
                                productName: input.dataset.productName,
                                quantity: qty
                            });
                            dayTotal += qty;
                        }
                    });

                    // その日の合計が0なら未選択リストへ
                    if (dayTotal === 0) {
                        missingDates.push(displayDate);
                    }
                    // その日の合計が2以上なら確認リストへ
                    else if (dayTotal >= 2) {
                        multipleOrderDates.push(displayDate + ' (' + dayTotal + '個)');
                    }
                });

                // 設定で「全日程必須」となっていて、かつ1つも選んでいない日がある場合はエラー
                if (mustOrderAllDays && missingDates.length > 0) {
                    showModalAsync('全ての日程で1つ以上注文してください。\n※このチームは注文のスキップができません。\n\n【未選択の日付】\n' + missingDates.join('\n'), 'alert');
                    return;
                }

                // 全部の日程で注文が0個（全く注文していない）場合はエラー
                if (orders.length === 0) {
                    showModalAsync('注文が1つもありません。最低1つは商品を選択してください。', 'alert');
                    return;
                }

                // 最低注文個数制限チェック
                var minOrderCount = 0;
                if (window._cachedTeamSettings && window._cachedTeamSettings.minOrderCount) {
                    minOrderCount = parseInt(window._cachedTeamSettings.minOrderCount) || 0;
                }

                if (minOrderCount > 0) {
                    var totalQty = 0;
                    orders.forEach(function (order) {
                        totalQty += order.quantity;
                    });

                    if (totalQty < minOrderCount) {
                        showModalAsync('ご注文ありがとうございます。現在の注文数は合計 ' + totalQty + ' 個です。\n\n大変恐れ入りますが、このチームは最低 ' + minOrderCount + ' 個からのご注文となります。\nあと ' + (minOrderCount - totalQty) + ' 個以上ご選択いただくようお願いいたします。🙇‍♀️', 'alert');
                        return;
                    }
                }

                // 平均数量に基づく単価確認メッセージの生成
                var applicablePrice = null;
                var avgDetailsText = '';
                if (window._cachedTeamSettings && 
                    window._cachedTeamSettings.avgPriceLimitQty > 0 && 
                    window._cachedTeamSettings.avgPricePromoPrice > 0) {
                    
                    var limitQty = window._cachedTeamSettings.avgPriceLimitQty;
                    var promoPrice = window._cachedTeamSettings.avgPricePromoPrice;
                    var normalPrice = window._cachedTeamSettings.avgPriceNormalPrice || 0;
                    
                    var allowedDates = getAllowedDates(deliveryType);
                    var totalDeliveryDays = allowedDates.length;
                    if (totalDeliveryDays === 0) totalDeliveryDays = 1;
                    
                    var totalQty = 0;
                    orders.forEach(function (order) {
                        totalQty += order.quantity;
                    });
                    
                    var avgQty = totalQty / totalDeliveryDays;
                    applicablePrice = (avgQty >= limitQty) ? promoPrice : normalPrice;
                    
                    var roundedAvg = Math.round(avgQty * 100) / 100;
                    avgDetailsText = '（合計' + totalQty + '個 ÷ 配送' + totalDeliveryDays + '日 ＝ 1日平均' + roundedAvg + '個）';
                }

                // ★ 選手の「週N回プラン」チェック
                var planCheckWarning = '';
                var dTString = (deliveryType || "").toString();
                var planMatch = dTString.match(/週\s*([0-9０-９])/);
                if (planMatch) {
                    var expectedWeeklyCount = parseInt(planMatch[1].replace(/[０-９]/g, function(s) { return String.fromCharCode(s.charCodeAt(0) - 0xFEE0); }));
                    if (expectedWeeklyCount > 0) {
                        var weeklyOrders = {};
                        orders.forEach(function(o) {
                            var d = new Date(o.date.replace(/-/g, '/'));
                            if (!isNaN(d.getTime())) {
                                var day = d.getDay();
                                var diff = d.getDate() - day + (day === 0 ? -6 : 1); // 月曜日
                                var monday = new Date(d);
                                monday.setDate(diff);
                                var weekKey = monday.getFullYear() + '/' + (monday.getMonth() + 1) + '/' + monday.getDate();
                                weeklyOrders[weekKey] = (weeklyOrders[weekKey] || 0) + o.quantity;
                            }
                        });

                        var weekKeys = Object.keys(weeklyOrders);
                        var totalOrderedQty = 0;
                        orders.forEach(function(o) { totalOrderedQty += o.quantity; });

                        if (weekKeys.length <= 1) {
                            if (totalOrderedQty < expectedWeeklyCount) {
                                var shortQty = expectedWeeklyCount - totalOrderedQty;
                                showModalAsync('【注文個数が不足しています】\n' + userName + ' 選手は「週' + expectedWeeklyCount + '回プラン」に設定されています。\n現在選択されている注文は 合計 ' + totalOrderedQty + '個 です。\n\nあと ' + shortQty + '個 のご注文をお願いいたします。🙇‍♂️', 'alert');
                                return;
                            } else if (totalOrderedQty > expectedWeeklyCount) {
                                var overQty = totalOrderedQty - expectedWeeklyCount;
                                planCheckWarning = '【注文個数のご確認】\n' + userName + ' 選手は「週' + expectedWeeklyCount + '回プラン」に設定されていますが、現在選択されている注文は 合計 ' + totalOrderedQty + '個（+' + overQty + '個）です。\n押し間違い等はございませんか？\n\n';
                            }
                        } else {
                            var shortIssues = [];
                            var overIssues = [];
                            weekKeys.forEach(function(wKey) {
                                var count = weeklyOrders[wKey];
                                var shortWeek = wKey.split('/').slice(1).join('/');
                                if (count < expectedWeeklyCount) {
                                    var diff = expectedWeeklyCount - count;
                                    shortIssues.push('・' + shortWeek + 'の週：現在 ' + count + '個（あと ' + diff + '個 不足）');
                                } else if (count > expectedWeeklyCount) {
                                    var diff = count - expectedWeeklyCount;
                                    overIssues.push('・' + shortWeek + 'の週：現在 ' + count + '個（' + diff + '個 多いご注文）');
                                }
                            });

                            if (shortIssues.length > 0) {
                                showModalAsync('【注文個数が不足している週があります】\n' + userName + ' 選手は「週' + expectedWeeklyCount + '回プラン」に設定されています。\n\n' + shortIssues.join('\n') + '\n\n各週 ' + expectedWeeklyCount + '個 になるよう、追加のご注文をお願いいたします。🙇‍♂️', 'alert');
                                return;
                            } else if (overIssues.length > 0) {
                                planCheckWarning = '【注文個数のご確認】\n' + userName + ' 選手は「週' + expectedWeeklyCount + '回プラン」に設定されていますが、以下の週で多く注文されています：\n\n' + overIssues.join('\n') + '\n\n押し間違い等はございませんか？\n\n';
                            }
                        }
                    }
                }

                // 日毎の個数チェック (1日に2個以上あれば警告)
                var confirmMsg = '';
                if (planCheckWarning) {
                    confirmMsg = planCheckWarning + 'この内容で注文を確定しますか？';
                } else if (applicablePrice !== null) {
                    confirmMsg = '適用単価は ' + applicablePrice + '円となります。' + avgDetailsText + '\nこの内容で注文を確定しますか？';
                } else {
                    confirmMsg = orders.length + '件の注文を確定しますか？';
                }

                if (multipleOrderDates.length > 0) {
                    var priceText = '';
                    if (applicablePrice !== null) {
                        priceText = '\n\n適用単価は ' + applicablePrice + '円となります。' + avgDetailsText + '\nこの内容で注文を確定しますか？';
                    } else {
                        priceText = '\n\nよろしいですか？';
                    }
                    
                    var warningTitle = (applicablePrice !== null) ? 
                        '【確認】以下の日付で複数個（2個以上）の注文があります。押し間違いがないかご確認ください：\n' :
                        '【確認】以下の日付で2個以上の注文があります：\n';

                    var basePlanText = planCheckWarning ? planCheckWarning + '\n' : '';
                    confirmMsg = basePlanText + warningTitle +
                        multipleOrderDates.join('\n') +
                        priceText;
                }

                showModalAsync(confirmMsg, 'confirm').then(function (isConfirmed) {
                    if (!isConfirmed) {
                        return;
                    }

                    // 重複チェック
                    var duplicateDates = [];
                    orders.forEach(function (o) {
                        var checkDate = normalizeDateString(o.date);
                        var hasDuplicate = window._currentUserHistory.some(function (h) {
                            return normalizeDateString(h.OrderDate) === checkDate;
                        });
                        if (hasDuplicate && duplicateDates.indexOf(checkDate) === -1) {
                            var displayDate = o.date.split('/').slice(1).join('/'); // MM/DD
                            duplicateDates.push(displayDate);
                        }
                    });

                    var decisionPromise;
                    if (duplicateDates.length > 0) {
                        var dupMsg = '【重複確認】<br>' +
                            '以下の日付は、すでに過去の注文が存在します：<br>' +
                            '<strong style="color:#e63946;">' + duplicateDates.join(', ') + '</strong><br><br>' +
                            '・<strong>上書き(更新)</strong>：過去の同日注文を自動削除し、今回の注文に差し替えます。<br>' +
                            '・<strong>追加購入</strong>：過去の注文を残したまま、今回の注文を追加します。';
                        decisionPromise = showModalAsync(dupMsg, 'three_button');
                    } else {
                        decisionPromise = Promise.resolve('append');
                    }

                    decisionPromise.then(function (choice) {
                        if (choice === 'cancel') {
                            return;
                        }

                        var isOverwrite = (choice === 'overwrite');

                        // ボタンを無効化して処理中を表示
                        btn.disabled = true;
                        btn.textContent = '送信中...';
                        btn.style.backgroundColor = '#ccc';

                        // 最終防衛線: 提出直前に lineUserId が無ければ再取得を試みる
                        new Promise(function (resolveLastChance) {
                            if (lineUserId) {
                                resolveLastChance();
                                return;
                            }
                            if (typeof liff !== 'undefined') {
                                try {
                                    var ctx = liff.getContext();
                                    if (ctx && ctx.userId) lineUserId = ctx.userId;
                                } catch (e) { }

                                try {
                                    if (!lineUserId && liff.getDecodedIDToken) {
                                        var dec = liff.getDecodedIDToken();
                                        if (dec && dec.sub) lineUserId = dec.sub;
                                    }
                                } catch (e) { }

                                if (!lineUserId && liff.isLoggedIn && liff.isLoggedIn()) {
                                    liff.getProfile().then(function (p) {
                                        if (p && p.userId) lineUserId = p.userId;
                                        resolveLastChance();
                                    }).catch(function (e) {
                                        resolveLastChance();
                                    });
                                    return;
                                }
                            }
                            resolveLastChance();
                        }).then(function () {
                            // ロード画面も出す
                            document.getElementById('loading').style.display = 'flex';
                            document.getElementById('loadingText').innerText = '送信しています...';

                            // 送信データ量を極限まで減らすため、注文リストを "YYYYMMDD:productId:quantity" 形式の圧縮文字列にする
                            var compressedList = orders.map(function(o) {
                                var cleanDate = o.date.replace(/\//g, '');
                                return cleanDate + ':' + o.productId + ':' + o.quantity;
                            }).join(',');

                            var orderData = {
                                category: category,
                                userId: userId,
                                userName: userName,
                                lineId: lineUserId,
                                compressed: compressedList,
                                isOverwrite: isOverwrite
                            };
                        gasJsonpFetch('api=submitOrders&data=' + encodeURIComponent(JSON.stringify(orderData)))
                            .then(function (rawRes) {
                                var res = rawRes;
                                if (typeof rawRes === 'string') {
                                    try { res = JSON.parse(rawRes); } catch (e) { }
                                }
                                console.log('submitOrders success:', JSON.stringify(res));
                                document.getElementById('loading').style.display = 'none';

                                if (!res || res.success === false) {
                                    showModalAsync('エラー: ' + (res ? res.message : '不明'), 'alert');
                                    btn.disabled = false;
                                    btn.textContent = '注文を確定する';
                                    btn.style.backgroundColor = '';
                                    return;
                                }

                                // --- サマリー作成（HTML表示用と共有用テキスト） ---
                                var summaryHtml = '<div style="text-align:left; font-size:14px; margin-top:10px; border:1px solid #eee; padding:10px; border-radius:8px; background:#fafafa;">';
                                summaryHtml += '<strong>注文リスト：</strong><br>';
                                var shareText = "【パン注文控え】\n選手名: " + userName + "\n------------------\n";

                                // 日付順に並び替え
                                var sortedOrders = orders.sort(function (a, b) {
                                    return a.date.localeCompare(b.date);
                                });
                                sortedOrders.forEach(function (order) {
                                    if (order.quantity > 0) {
                                        var shortDate = order.date.split('/').slice(1).join('/'); // MM/DD
                                        summaryHtml += '・' + shortDate + '：' + order.productName + ' (' + order.quantity + '個)<br>';
                                        shareText += "・" + shortDate + "：" + order.productName + " (" + order.quantity + "個)\n";
                                    }
                                });
                                summaryHtml += '</div>';
                                shareText += "------------------\nご注文ありがとうございます！";

                                // サマリー表示後に画面自体を「完了」に置き換える処理
                                function showCompletionScreen() {
                                    var formArea = document.querySelector('.container');
                                    var headerArea = document.getElementById('mainHeader');
                                    if (formArea) formArea.style.display = 'none';
                                    if (headerArea) headerArea.style.display = 'none';
                                    document.body.innerHTML = '<div style="text-align:center; padding: 40px 20px; font-family: sans-serif;">' +
                                        '<div style="font-size: 50px; color: #4CAF50; margin-bottom: 20px;">✓</div>' +
                                        '<h2 style="color: #333; margin-bottom: 10px;">注文が完了しました</h2>' +
                                        '<p style="color: #666; font-size: 16px; line-height: 1.5;">ご協力ありがとうございます。<br>この画面は右上の「×」等で閉じて終了してください。</p>' +
                                        '</div>';
                                }

                                var isInLiff = false;
                                try {
                                    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
                                        isInLiff = true;
                                    }
                                } catch (liffErr) {
                                    console.error("LIFF check error:", liffErr);
                                }

                                if (isInLiff) {
                                    showModalAsync('注文が完了しました！<br>' + summaryHtml, 'success', shareText).then(function () {
                                        showCompletionScreen();
                                        try { liff.closeWindow(); } catch (e) { }
                                    });
                                } else {
                                    // ハイブリッド型
                                    showModalAsync('注文が完了しました！<br>' + summaryHtml, 'success', shareText).then(function () {
                                        showCompletionScreen();
                                    });
                                }
                            })
                            .catch(function (err) {
                                document.getElementById('loading').style.display = 'none';
                                showModalAsync('送信エラー: ' + err.message, 'alert');
                                // エラー時はボタンを戻す
                                btn.disabled = false;
                                btn.textContent = '注文を確定する';
                                btn.style.backgroundColor = '';
                            });
                    });
                });
            });
            } catch (fatalError) {
                showModalAsync('システムエラー: ' + fatalError.message, 'alert');
                var btn2 = document.querySelector('.submit-btn');
                if (btn2) {
                    btn2.disabled = false;
                    btn2.textContent = '注文を確定する';
                    btn2.style.backgroundColor = '';
                }
            }
        }

        // --- 注文履歴画面の構築（本人専用・完全プライバシー保護・超高速即時描画） ---
        function renderHistoryView() {
            var container = document.getElementById('calendarContainer');
            var footer = document.querySelector('footer');
            var cycleArea = document.getElementById('cycleSelectArea');

            // 注文用のUIを隠す
            if (footer) footer.style.display = 'none';
            if (cycleArea) cycleArea.style.display = 'none';

            // ユーザー特定（LINE ID または 端末の連携済み情報）
            var storedUserId = null;
            var storedUserName = null;

            try {
                var s = JSON.parse(localStorage.getItem('walpass_bound_user') || 'null');
                if (s) {
                    storedUserId = s.userId || null;
                    storedUserName = s.name || s.userName || null;
                }
            } catch (e) { }

            if (window._cachedBoundUser) {
                storedUserId = storedUserId || window._cachedBoundUser.userId;
                storedUserName = storedUserName || window._cachedBoundUser.name;
            }

            if (window._cachedInitialData && window._cachedInitialData.isBound && window._cachedInitialData.users && window._cachedInitialData.users.length > 0) {
                storedUserId = storedUserId || window._cachedInitialData.users[0].UserID || window._cachedInitialData.users[0]['ユーザーID'];
                storedUserName = storedUserName || window._cachedInitialData.users[0].Name || window._cachedInitialData.boundUserName;
            }

            // 初回通信（getInitialData）で既に注文履歴が取得できている場合は即時表示（二重通信なし・0秒描画）
            if (window._cachedInitialData && Array.isArray(window._cachedInitialData.orders)) {
                var initialOrders = window._cachedInitialData.orders;
                var uName = window._cachedInitialData.boundUserName || storedUserName;

                if (initialOrders.length > 0) {
                    displayHistoryOrders(initialOrders, uName);
                    return;
                } else if (window._cachedInitialData.isBound || storedUserId || storedUserName) {
                    var uNameDisplay = uName || "選手";
                    container.innerHTML = '<div style="padding:30px 15px; text-align:center; background:#fff; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:15px;">' +
                        '<h3 style="font-size:1.1rem; margin-top:0; color:#0f2942;">📋 ' + uNameDisplay + ' 選手の注文履歴</h3>' +
                        '<p style="font-size:0.9rem; color:#888; margin-bottom:20px;">直近の注文履歴はまだありません。</p>' +
                        '<button onclick="urlMode=null; localStorage.removeItem(\'walpass_mode\'); renderCalendar(); renderCycleUI(); document.querySelector(\'footer\').style.display=\'block\'; document.getElementById(\'cycleSelectArea\').style.display=\'\';" style="width:100%; padding:14px; background:#fca311; color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer;">パンを注文する</button>' +
                        '</div>';
                    return;
                } else {
                    container.innerHTML = '<div style="background:#fff; border-radius:14px; padding:30px 20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; margin-bottom:15px;">' +
                        '<h3 style="color:#0f2942; margin-top:0; font-size:1.1rem;">⚠️ ご利用案内</h3>' +
                        '<p style="color:#666; font-size:0.9rem; line-height:1.6; margin-bottom:20px;">ユーザー連携が確認できませんでした。<br>初回の方は、まず「パンを注文する」画面からお名前を登録してご注文ください。</p>' +
                        '<button onclick="urlMode=null; localStorage.removeItem(\'walpass_mode\'); renderCalendar(); renderCycleUI(); document.querySelector(\'footer\').style.display=\'block\'; document.getElementById(\'cycleSelectArea\').style.display=\'\';" style="width:100%; padding:14px; background:#fca311; color:white; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer;">パンを注文する</button>' +
                        '</div>';
                    return;
                }
            }

            container.innerHTML = '<div style="text-align:center; padding: 30px 20px;"><div class="spinner" style="margin: 0 auto 12px;"></div>最新の注文履歴を取得中...</div>';

            var debugLineId = (typeof lineUserId !== 'undefined' ? lineUserId : null);

            var historyParams = 'api=getOrderHistory';
            if (debugLineId) historyParams += '&lineId=' + encodeURIComponent(debugLineId);
            if (storedUserId) historyParams += '&userId=' + encodeURIComponent(storedUserId);
            if (storedUserName) historyParams += '&userName=' + encodeURIComponent(storedUserName);

            gasJsonpFetch(historyParams)
                .then(function (res) {
                    try {
                        if (!res || !res.success) {
                            var errMsg = (res && res.message) ? res.message : "ユーザー連携が確認できませんでした。";
                            container.innerHTML = '<div style="background:#fff; border-radius:14px; padding:30px 20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; margin-bottom:15px;">' +
                                '<h3 style="color:#0f2942; margin-top:0; font-size:1.1rem;">⚠️ ご利用案内</h3>' +
                                '<p style="color:#666; font-size:0.9rem; line-height:1.6; margin-bottom:20px;">' + errMsg + '<br>初回の方は、まず「パンを注文する」画面からお名前を登録してご注文ください。</p>' +
                                '<button onclick="urlMode=null; localStorage.removeItem(\'walpass_mode\'); renderCalendar(); renderCycleUI(); document.querySelector(\'footer\').style.display=\'block\'; document.getElementById(\'cycleSelectArea\').style.display=\'\';" style="width:100%; padding:14px; background:#fca311; color:white; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer;">パンを注文する</button>' +
                                '</div>';
                            return;
                        }

                        if (!res.orders || res.orders.length === 0) {
                            var uNameDisplay = res.userName || storedUserName || "選手";
                            container.innerHTML = '<div style="padding:30px 15px; text-align:center; background:#fff; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:15px;">' +
                                '<h3 style="font-size:1.1rem; margin-top:0; color:#0f2942;">📋 ' + uNameDisplay + ' 選手の注文履歴</h3>' +
                                '<p style="font-size:0.9rem; color:#888; margin-bottom:20px;">直近の注文履歴はまだありません。</p>' +
                                '<button onclick="urlMode=null; localStorage.removeItem(\'walpass_mode\'); renderCalendar(); renderCycleUI(); document.querySelector(\'footer\').style.display=\'block\'; document.getElementById(\'cycleSelectArea\').style.display=\'\';" style="width:100%; padding:14px; background:#fca311; color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:1rem; cursor:pointer;">パンを注文する</button>' +
                                '</div>';
                            return;
                        }

                        displayHistoryOrders(res.orders, res.userName || storedUserName);
                    } catch (err) {
                        console.error(err);
                        container.innerHTML = '<div style="padding:20px; text-align:center; color:red;">表示処理中にエラーが発生しました: ' + err.message + '</div>';
                    }
                })
                .catch(function (err) {
                    container.innerHTML = '<div style="padding:20px; text-align:center; color:red;">通信エラーが発生しました: ' + err.message + '</div>';
                });
        }

        function displayHistoryOrders(orders, userName) {
            var container = document.getElementById('calendarContainer');
            var grouped = {};

            orders.forEach(function (ord) {
                var dateStr = String(ord.OrderDate || ord.date || ord['日付'] || "").replace(/-/g, '/').trim();
                var monthKey = "その他";
                var parts = dateStr.split('/');
                if (parts.length >= 2) {
                    monthKey = parts[0] + "年" + parseInt(parts[1], 10) + "月";
                }

                if (!grouped[monthKey]) grouped[monthKey] = { orders: [], totalQty: 0, totalAmount: 0 };
                grouped[monthKey].orders.push(ord);

                var qty = parseInt(ord.Quantity || ord['個数'] || 1) || 0;
                var price = Number(ord.Price || ord.price || ord['単価']) || 0;
                grouped[monthKey].totalQty += qty;
                grouped[monthKey].totalAmount += (qty * price);
            });

            var headerTitle = userName ? '📋 ' + userName + ' 選手の注文履歴' : '📋 注文履歴';
            var html = '<h2 style="text-align:center; font-size:1.15rem; margin-bottom:15px; color:#0f2942;">' + headerTitle + '</h2>';

            var months = Object.keys(grouped).sort().reverse();
            months.forEach(function (month) {
                var data = grouped[month];
                html += '<div class="history-card" style="background:#fff; border-radius:14px; padding:15px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">';
                html += '<div class="history-month" style="display:flex; justify-content:space-between; font-weight:bold; border-bottom:1px solid #eee; padding-bottom:8px; margin-bottom:10px;"><span>' + month + '</span><span style="font-size:0.85rem; color:#666;">' + data.orders.length + '件</span></div>';

                data.orders.forEach(function (ord) {
                    var dateStr = String(ord.OrderDate || ord.date || ord['日付'] || "").replace(/-/g, '/').trim();
                    var parts = dateStr.split('/');
                    var dateShort = parts.length >= 3 ? (parseInt(parts[1], 10) + "/" + parseInt(parts[2], 10)) : dateStr;
                    var qty = parseInt(ord.Quantity || ord['個数'] || 1) || 0;
                    var price = Number(ord.Price || ord.price || ord['単価']) || 0;
                    var itemAmount = qty * price;
                    var pName = ord.ProductName || ord['商品名'] || 'パン';

                    html += '<div class="history-item" style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px dashed #f0f0f0; font-size:0.92rem;">';
                    html += '<span class="history-date" style="color:#fca311; font-weight:bold; min-width:45px;">' + dateShort + '</span>';
                    html += '<span class="history-name" style="flex:1; padding:0 8px; color:#333;">' + pName + '</span>';
                    html += '<span class="history-qty" style="color:#0f2942; font-weight:bold;">' + qty + '個' + (itemAmount > 0 ? ' (¥' + itemAmount.toLocaleString() + ')' : '') + '</span>';
                    html += '</div>';
                });

                html += '<div class="history-total-row" style="margin-top:10px; text-align:right; font-weight:bold; font-size:0.95rem; color:#0f2942;">合計 <span class="history-total-amount" style="color:#e53935; font-size:1.1rem; margin-left:5px;">' + data.totalQty + ' 個' + (data.totalAmount > 0 ? ' / ¥' + data.totalAmount.toLocaleString() : '') + '</span></div>';
                html += '</div>';
            });

            // 注文画面に戻るボタン
            html += '<button onclick="urlMode=null; localStorage.removeItem(\'walpass_mode\'); renderCalendar(); renderCycleUI(); document.querySelector(\'footer\').style.display=\'block\'; document.getElementById(\'cycleSelectArea\').style.display=\'\';" style="width:100%; padding:14px; background:#fca311; color:white; border:none; border-radius:10px; font-weight:bold; font-size:1rem; margin-top:5px; margin-bottom:15px; cursor:pointer;">パンを注文する</button>';

            container.innerHTML = html;
        }
    </script>
</body>
